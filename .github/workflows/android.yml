name: Construir APK Android
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Aceitar licenças do Android SDK
        run: yes | sdkmanager --licenses > /dev/null || true
      - name: Preparar app
        working-directory: mobile
        run: |
          npm ci || npm install
          node scripts/copy-www.js
          npx cap sync android
      - name: Gravar a chave de assinatura
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/anamnese.jks"
      - name: Compilar APK assinado
        working-directory: mobile/android
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/anamnese.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Kuravo-APK
          path: mobile/android/app/build/outputs/apk/release/*.apk
